{% extends 'base.html' %}
{% load static %}

{% block title %}Entrar — AMM HelpDesk{% endblock %}

{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-8">
  <div class="w-full max-w-md">
    <!-- Logo & Card Container -->
    <div class="bg-navy-light/40 border border-navy-border/40 rounded-2xl p-8 backdrop-blur-md shadow-2xl shadow-navy/80">
      
      <!-- Logo and Welcome -->
      <div class="text-center mb-8">
        <a href="https://ammsolucoes.com.br/" class="inline-block transition-transform duration-300 hover:scale-105">
          <img src="{% static 'img/logoammlogin.png' %}" alt="AMM Soluções Logo" class="h-20 mx-auto object-contain mb-4">
        </a>
        <h2 class="text-2xl font-bold tracking-tight text-white mt-2">Bem-vindo!</h2>
        <p class="text-slate-400 text-sm mt-1">Acesse a área administrativa do HelpDesk</p>
      </div>

      <!-- Form -->
      <form action="submit" method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div>
          <label for="floatingInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuário</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" 
                   id="floatingInput" 
                   name="username" 
                   placeholder="Digite seu usuário" 
                   required
                   class="block w-full bg-navy/60 border border-navy-border/80 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue/50 focus:border-blue transition-all text-sm">
          </div>
        </div>

        <div>
          <label for="floatingPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Senha</label>
          <div class="relative" x-data="{ showPass: false }">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input :type="showPass ? 'text' : 'password'" 
                   id="floatingPassword" 
                   name="password" 
                   placeholder="Digite sua senha" 
                   required
                   class="block w-full bg-navy/60 border border-navy-border/80 rounded-xl py-3 pl-10 pr-10 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue/50 focus:border-blue transition-all text-sm">
            <button type="button" 
                    @click="showPass = !showPass"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-300 transition-colors">
              <i class="fa-solid" :class="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" 
                  class="w-full bg-gradient-to-r from-blue to-sky-600 hover:from-blue/90 hover:to-sky-600/90 text-white font-semibold rounded-xl py-3 shadow-lg shadow-blue/20 transition-all duration-300 transform hover:-translate-y-0.5 focus:ring-2 focus:ring-blue/50 focus:outline-none text-sm uppercase tracking-wider">
            Entrar
          </button>
        </div>
      </form>
      
      <!-- Back to public Home -->
      <div class="mt-8 text-center border-t border-navy-border/30 pt-6">
        <a href="/FAQ" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center justify-center space-x-1">
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
          <span>Voltar para o FAQ</span>
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
