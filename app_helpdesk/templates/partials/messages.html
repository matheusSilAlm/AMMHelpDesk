{% if messages %}
  <div class="max-w-7xl mx-auto px-4 mt-4 space-y-2">
    {% for message in messages %}
      <div x-data="{ show: true }" 
           x-show="show" 
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-y-[-10px]"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 translate-y-[-10px]"
           class="flex items-center justify-between p-4 rounded-xl border {% if message.tags == 'success' %}bg-emerald-950/40 border-emerald-500/30 text-emerald-300{% elif message.tags == 'error' or message.tags == 'danger' %}bg-rose-950/40 border-rose-500/30 text-rose-300{% elif message.tags == 'warning' %}bg-amber-950/40 border-amber-500/30 text-amber-300{% else %}bg-sky-950/40 border-sky-500/30 text-sky-300{% endif %} shadow-lg backdrop-blur-sm">
        
        <div class="flex items-center space-x-2">
          {% if message.tags == 'success' %}
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
          {% elif message.tags == 'error' or message.tags == 'danger' %}
            <i class="fa-solid fa-circle-exclamation text-rose-400"></i>
          {% elif message.tags == 'warning' %}
            <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
          {% else %}
            <i class="fa-solid fa-circle-info text-sky-400"></i>
          {% endif %}
          <span class="text-sm font-medium">{{ message }}</span>
        </div>

        <button @click="show = false" class="text-current opacity-70 hover:opacity-100 transition-opacity p-1 ml-4 focus:outline-none">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
