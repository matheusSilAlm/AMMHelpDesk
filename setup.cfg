[flake8]
max-line-length = 100
exclude =
    migrations,
    __pycache__,
    staticfiles,
    .git,
    venv,
    .venv
ignore =
    E501,
    W503,
    E203
per-file-ignores =
    */migrations/*.py:E501

[isort]
profile = black
known_django = django
known_third_party = decouple,axes,bs4
default_section = THIRDPARTY
line_length = 100
skip = migrations

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
